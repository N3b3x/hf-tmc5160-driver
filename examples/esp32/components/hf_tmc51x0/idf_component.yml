###############################################################################
# TMC51x0 Driver – ESP-IDF Component Manifest
###############################################################################

name: hf-tmc51x0-driver
version: "1.0.0"
description: |
  Hardware-agnostic TMC51x0 stepper motor driver (TMC5130 & TMC5160).
  Features stealthChop, spreadCycle, StallGuard2, encoder support,
  SPI/UART communication, and daisy-chain support.

url: "https://www.trinamic.com/products/integrated-circuits/details/tmc5160/"
repository: "https://github.com/N3b3x/hf-tmc5160-driver.git"
documentation: "https://github.com/N3b3x/hf-tmc5160-driver/blob/main/README.md"
issues: "https://github.com/N3b3x/hf-tmc5160-driver/issues"

license: "GPL-3.0"
maintainers:
  - "HardFOC"

targets:
  - esp32
  - esp32c6
  - esp32s3
  - esp32c3

dependencies:
  idf: ">=5.0.0"

tags:
  - "tmc51x0"
  - "tmc5160"
  - "stepper"
  - "motor-control"
  - "driver"
  - "spi"
  - "uart"
  - "hardware-agnostic"

