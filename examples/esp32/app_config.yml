# ESP32 TMC51x0 Driver - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"
metadata:
  project: "ESP32 TMC51x0 Driver Examples (TMC5130 & TMC5160)"
  default_app: "internal_ramp_comprehensive_test"
  target: "esp32c6"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  # Internal Ramp Test Suites
  internal_ramp_comprehensive_test:
    description: >
      Comprehensive internal ramp testing suite - combines core, motor control,
      ramp control, diagnostics, and protection tests into a single wholesome
      test suite for SPI internal ramp mode (single motor, with encoder and
      reference switches)
    source_file: "internal_ramp_test_suites/internal_ramp_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  spi_daisy_chain_comprehensive_test:
    description: >
      Comprehensive SPI daisy chain testing suite - SPI daisy chain setup,
      position management, multi-motor coordination (set TEST_CHAIN_LENGTH to match your hardware)
    source_file: "internal_ramp_test_suites/spi_daisy_chain_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  uart_multi_node_comprehensive_test:
    description: >
      UART communication test suite - basic register access, node addressing,
      send delay configuration, and motor control over UART single-wire interface
      (set TEST_NODE_COUNT to match your hardware, default: 1)
    source_file: "internal_ramp_test_suites/uart_multi_node_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  internal_ramp_sinusoidal:
    description: "Sinusoidal motion pattern example"
    source_file: "internal_ramp_test_suites/internal_ramp_sinusoidal.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  # Fatigue Testing Application (Unified - supports both StallGuard2 and encoder)
  fatigue_test_espnow_unit:
    description: >
      Unified fatigue test unit with ESP-NOW and UART support, dual bounds
      detection (StallGuard2/Encoder) - replaces fatigue_test_stallguard and
      fatigue_test_encoder
    source_file: "fatigue_test_espnow/main.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  # ESP-NOW Protocol Test Unit (No Motor Control)
  espnow_protocol_test_unit:
    description: >
      Minimal ESP-NOW protocol test unit - receives commands and responds with
      protocol messages, but does NOT control motors (useful for testing ESP-NOW
      communication without hardware dependencies)
    source_file: "fatigue_test_espnow/espnow_protocol_test_unit.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  # Tuning Tools
  stallguard_tuning:
    description: "Tool to automatically tune StallGuard2 Threshold (SGT) for sensorless homing"
    source_file: "tuning/stallguard_tuning.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  bounds_finding_test:
    description: "Standalone bounds finding test - searches for mechanical limits, homes to center, reports results"
    source_file: "tuning/bounds_finding_test.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  # Sensor Examples
  abn_encoder_reader:
    description: >
      ABN encoder position reader - Continuously reads and displays encoder
      position from ABN incremental encoder
    source_file: "sensors/abn_encoder_reader.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  # Diagnostics
  i2c_scan:
    description: "I2C bus scanner for OLED UI board wiring (SDA=GPIO5, SCL=GPIO23)"
    source_file: "diagnostics/i2c_scan.cpp"
    category: "diagnostics"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

build_config:
  build_types:
    Debug:
      description: "Debug symbols, verbose logging, assertions enabled"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build optimized for performance and size"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tmc51x0_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []
