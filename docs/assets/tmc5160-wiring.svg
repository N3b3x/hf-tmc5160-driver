<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t-wir d-wir">
  <title id="t-wir">TMC5160 wiring &#8212; SPI and UART modes</title>
  <desc id="d-wir">Two wiring diagrams side by side: top panel shows SPI with internal ramp generator (recommended), bottom panel shows UART single-wire mode. Mode-strap pins determine operating mode at power-up.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .box      { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .chip     { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .wire-pwr { stroke: #c53030; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #4a5568; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-spi { stroke: #2b6cb0; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-uart{ stroke: #276749; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-strap{stroke: #d69e2e; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4 2; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: start; }
      .pinR     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: end; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
  </defs>
  <rect class="panel" width="880" height="520"/>

  <!-- ============================================================ -->
  <!-- TOP PANEL: SPI + internal ramp generator (y=0..250)          -->
  <!-- ============================================================ -->
  <text class="head" x="440" y="24">TMC5160 &#8212; wiring reference</text>

  <rect class="box" x="20" y="40" width="840" height="210" rx="8"/>
  <text class="title" x="440" y="62">SPI + internal ramp generator (recommended)</text>
  <text class="small" x="440" y="78">SPI_MODE = HIGH (3.3 V)  &#183;  SD_MODE = LOW (GND)</text>

  <!-- MCU box -->
  <rect class="box" x="60" y="96" width="160" height="138" rx="6"/>
  <text class="title" x="140" y="118">MCU</text>
  <text class="pinL" x="72"  y="142">SCK</text>
  <text class="pinL" x="72"  y="160">MOSI</text>
  <text class="pinL" x="72"  y="178">MISO</text>
  <text class="pinL" x="72"  y="196">CS</text>
  <text class="pinL" x="72"  y="214">EN</text>

  <!-- TMC5160 chip (SPI mode) -->
  <rect class="chip" x="520" y="96" width="300" height="138" rx="8"/>
  <text class="title" x="670" y="118">TMC5160</text>

  <!-- Left-side pins (directly connected) -->
  <text class="pinR" x="608" y="142">SCK</text>
  <text class="pinR" x="608" y="160">SDI</text>
  <text class="pinR" x="608" y="178">SDO</text>
  <text class="pinR" x="608" y="196">CSN</text>
  <text class="pinR" x="608" y="214">EN</text>

  <!-- Right-side pins (power + mode straps) -->
  <text class="pinL" x="734" y="142">VDD</text>
  <text class="pinL" x="734" y="160">GND</text>
  <text class="pinL" x="734" y="182">SPI_MODE</text>
  <text class="pinL" x="734" y="200">SD_MODE</text>

  <!-- Mode-strap labels -->
  <text class="smallL" x="734" y="214">pin 22 / pin 21</text>

  <!-- SPI wires (blue): MCU right edge 220 -> TMC left edge 520 -->
  <line class="wire-spi" x1="220" y1="138" x2="520" y2="138"/>
  <line class="wire-spi" x1="220" y1="156" x2="520" y2="156"/>
  <line class="wire-spi" x1="220" y1="174" x2="520" y2="174"/>
  <line class="wire-spi" x1="220" y1="192" x2="520" y2="192"/>
  <line class="wire-spi" x1="220" y1="210" x2="520" y2="210"/>

  <!-- Wire labels (centered between boxes) -->
  <text class="small" x="370" y="134">SCK</text>
  <text class="small" x="370" y="152">MOSI &#8594; SDI</text>
  <text class="small" x="370" y="170">MISO &#8592; SDO</text>
  <text class="small" x="370" y="188">CS &#8594; CSN</text>
  <text class="small" x="370" y="206">EN</text>

  <!-- Power wires (right side of TMC chip) -->
  <line class="wire-pwr" x1="820" y1="138" x2="848" y2="138"/>
  <text class="smallL" x="850" y="142">3.3 V</text>
  <line class="wire-gnd" x1="820" y1="156" x2="848" y2="156"/>
  <text class="smallL" x="850" y="160">GND</text>

  <!-- Mode strap wires (dashed yellow) -->
  <line class="wire-strap" x1="820" y1="178" x2="848" y2="178"/>
  <text class="smallL" x="850" y="182">3.3 V (HIGH)</text>
  <line class="wire-strap" x1="820" y1="196" x2="848" y2="196"/>
  <text class="smallL" x="850" y="200">GND (LOW)</text>

  <!-- ============================================================ -->
  <!-- BOTTOM PANEL: UART single-wire mode (y=260..470)             -->
  <!-- ============================================================ -->
  <rect class="box" x="20" y="264" width="840" height="196" rx="8"/>
  <text class="title" x="440" y="286">UART single-wire mode</text>
  <text class="small" x="440" y="302">SPI_MODE = LOW (GND)  &#183;  SD_MODE = LOW (GND)</text>

  <!-- MCU box -->
  <rect class="box" x="60" y="318" width="160" height="80" rx="6"/>
  <text class="title" x="140" y="340">MCU</text>
  <text class="pinL" x="72"  y="362">TX</text>
  <text class="pinL" x="72"  y="380">RX</text>

  <!-- TMC5160 chip (UART mode) -->
  <rect class="chip" x="520" y="318" width="300" height="128" rx="8"/>
  <text class="title" x="670" y="340">TMC5160</text>

  <!-- Left-side pins (UART) -->
  <text class="pinR" x="608" y="362">UART_RXD</text>
  <text class="pinR" x="608" y="380">UART_TXD</text>

  <!-- Right-side pins (power + mode straps) -->
  <text class="pinL" x="734" y="362">VDD</text>
  <text class="pinL" x="734" y="380">GND</text>
  <text class="pinL" x="734" y="402">SPI_MODE</text>
  <text class="pinL" x="734" y="420">SD_MODE</text>

  <!-- Mode-strap labels -->
  <text class="smallL" x="734" y="434">pin 22 / pin 21</text>

  <!-- UART wires (green) -->
  <line class="wire-uart" x1="220" y1="358" x2="520" y2="358"/>
  <line class="wire-uart" x1="220" y1="376" x2="520" y2="376"/>

  <!-- Wire labels -->
  <text class="small" x="370" y="354">TX &#8594; UART_RXD</text>
  <text class="small" x="370" y="372">RX &#8592; UART_TXD</text>

  <!-- Power wires -->
  <line class="wire-pwr" x1="820" y1="358" x2="848" y2="358"/>
  <text class="smallL" x="850" y="362">3.3 V</text>
  <line class="wire-gnd" x1="820" y1="376" x2="848" y2="376"/>
  <text class="smallL" x="850" y="380">GND</text>

  <!-- Mode strap wires (dashed yellow, both LOW) -->
  <line class="wire-strap" x1="820" y1="398" x2="848" y2="398"/>
  <text class="smallL" x="850" y="402">GND (LOW)</text>
  <line class="wire-strap" x1="820" y1="416" x2="848" y2="416"/>
  <text class="smallL" x="850" y="420">GND (LOW)</text>

  <!-- ============================================================ -->
  <!-- LEGEND (y=476..510)                                          -->
  <!-- ============================================================ -->
  <g transform="translate(30, 486)">
    <text class="titleL" x="0" y="0">Legend</text>

    <line class="wire-pwr" x1="80" y1="-3" x2="104" y2="-3"/>
    <text class="legend" x="112" y="0">3.3 V power</text>

    <line class="wire-gnd" x1="210" y1="-3" x2="234" y2="-3"/>
    <text class="legend" x="242" y="0">GND</text>

    <line class="wire-spi" x1="300" y1="-3" x2="324" y2="-3"/>
    <text class="legend" x="332" y="0">SPI bus</text>

    <line class="wire-uart" x1="410" y1="-3" x2="434" y2="-3"/>
    <text class="legend" x="442" y="0">UART</text>

    <line class="wire-strap" x1="510" y1="-3" x2="534" y2="-3"/>
    <text class="legend" x="542" y="0">Mode strap (set before power-up)</text>
  </g>

  <text class="small" x="440" y="510">Mode pins are read at startup &#8212; configure before power-up or reset.</text>
</svg>
