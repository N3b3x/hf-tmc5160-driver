# ESP32 TMC5160 Driver - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"
metadata:
  project: "ESP32 TMC5160 Driver Examples"
  default_app: "core_comprehensive_test"
  target: "esp32c6"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  # Comprehensive Test Suites (Single Motor)
  core_comprehensive_test:
    description: "Comprehensive core initialization and basic setup testing suite (single motor)"
    source_file: "core_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  ramp_control_comprehensive_test:
    description: "Comprehensive ramp control testing suite - ramp modes, position control, speed control, unit conversions (single motor)"
    source_file: "ramp_control_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  motor_control_comprehensive_test:
    description: "Comprehensive motor control testing suite - enable/disable, current control, chopper, stealthChop, CoolStep, DCStep, LUT, motor setup (single motor)"
    source_file: "motor_control_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  encoder_comprehensive_test:
    description: "Comprehensive encoder testing suite - encoder configuration, resolution, position reading, deviation detection (single motor)"
    source_file: "encoder_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  diagnostics_comprehensive_test:
    description: "Comprehensive diagnostics testing suite - driver status, StallGuard2, lost steps, phase currents, PWM scale, microstep diagnostics, GPIO, factory/OTP config, sensorless homing (single motor)"
    source_file: "diagnostics_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  protection_comprehensive_test:
    description: "Comprehensive protection testing suite - short circuit and overtemperature protection (single motor)"
    source_file: "protection_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  # Comprehensive Test Suites (Multi-Motor - Requires Special Hardware)
  spi_daisy_chain_comprehensive_test:
    description: "Comprehensive SPI daisy chain testing suite - SPI daisy chain setup, position management, multi-motor coordination (MULTI-MOTOR HARDWARE REQUIRED)"
    source_file: "spi_daisy_chain_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  uart_multi_node_comprehensive_test:
    description: "Comprehensive UART multi-node testing suite - UART node addressing, slave address configuration, send delay, multi-node coordination (MULTI-MOTOR HARDWARE REQUIRED)"
    source_file: "uart_multi_node_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  # Specialized Examples (Not covered by comprehensive tests)
  sinusoidal:
    description: "Sinusoidal motion pattern example"
    source_file: "sinusoidal.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  bounds_finding_sinuous_motion:
    description: "Comprehensive example: Sensorless bounds finding and sinuous motion with degree/radian support"
    source_file: "bounds_finding_sinuous_motion.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  stallguard_tuning:
    description: "Tool to automatically tune StallGuard2 Threshold (SGT) for sensorless homing"
    source_file: "stallguard_tuning.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  gpio_pin_config_example:
    description: "GPIO pin configuration example - demonstrates all TMC5160 control pins (DIAG0, DIAG1, CLK, reference switches, encoder)"
    source_file: "gpio_pin_config_example.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: false

  pin_config_struct_example:
    description: "Pin configuration struct example - demonstrates TMC5160PinConfig struct with automatic compound pin handling"
    source_file: "pin_config_struct_example.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

build_config:
  build_types:
    Debug:
      description: "Debug symbols, verbose logging, assertions enabled"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build optimized for performance and size"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tmc5160_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []
