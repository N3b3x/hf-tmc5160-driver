# ESP32 TMC51x0 Driver - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"
metadata:
  project: "ESP32 TMC51x0 Driver Examples (TMC5130 & TMC5160)"
  default_app: "internal_ramp_comprehensive_test"
  target: "esp32c6"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  # Comprehensive Test Suites (Single Motor)
  internal_ramp_comprehensive_test:
    description: "Comprehensive internal ramp testing suite - combines core, motor control, ramp control, diagnostics, and protection tests into a single wholesome test suite for SPI internal ramp mode (single motor, with encoder and reference switches)"
    source_file: "internal_ramp_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  # Comprehensive Test Suites (Multi-Motor - Requires Special Hardware)
  spi_daisy_chain_comprehensive_test:
    description: "Comprehensive SPI daisy chain testing suite - SPI daisy chain setup, position management, multi-motor coordination (MULTI-MOTOR HARDWARE REQUIRED)"
    source_file: "spi_daisy_chain_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  uart_multi_node_comprehensive_test:
    description: "Comprehensive UART multi-node testing suite - UART node addressing, slave address configuration, send delay, multi-node coordination (MULTI-MOTOR HARDWARE REQUIRED)"
    source_file: "uart_multi_node_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  # Specialized Examples (Not covered by comprehensive tests)
  internal_ramp_sinusoidal:
    description: "Sinusoidal motion pattern example"
    source_file: "internal_ramp_sinusoidal.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  fatigue_test_stallguard:
    description: "Fatigue testing: Back-and-forth oscillatory motion between bounds using StallGuard2 sensorless detection"
    source_file: "fatigue_test_stallguard.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  fatigue_test_encoder:
    description: "Fatigue testing: Back-and-forth oscillatory motion between bounds using encoder position monitoring"
    source_file: "fatigue_test_encoder.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  stallguard_tuning:
    description: "Tool to automatically tune StallGuard2 Threshold (SGT) for sensorless homing"
    source_file: "stallguard_tuning.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  # ESP-NOW Fatigue Test System
  fatigue_test_espnow_unit:
    description: "Unified fatigue test unit with ESP-NOW and UART support, dual bounds detection (StallGuard2/Encoder)"
    source_file: "fatigue_test_espnow/test_unit/main.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  fatigue_test_espnow_ui:
    description: "Remote controller with OLED display and rotary encoder for fatigue test unit (ESP-NOW communication)"
    source_file: "fatigue_test_espnow/ui_board/main.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  fatigue_test_espnow_slideshow:
    description: "E-ink slideshow application - displays images from SD card on 2.9\" ThinkInk display"
    source_file: "fatigue_test_espnow/ui_slideshow_board/main.cpp"
    category: "display"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

build_config:
  build_types:
    Debug:
      description: "Debug symbols, verbose logging, assertions enabled"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build optimized for performance and size"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tmc51x0_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []
